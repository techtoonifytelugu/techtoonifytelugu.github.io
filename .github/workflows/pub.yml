name: publish-quizfull2-v5
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      sha:
        required: true
permissions:
  contents: write
  pages: write
jobs:
  pub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: ipl/quiz-full2
          sparse-checkout-cone-mode: false
      - name: fetch verify copy
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha }}
        run: |
          PIN=5987ea2ca73141da79696a196913d984adb5f751
          NOW=$(git rev-parse HEAD:ipl/quiz-full2)
          echo "pin=$PIN now=$NOW head=$(git rev-parse HEAD)"
          [ "$NOW" = "$PIN" ] || { echo "target folder changed since review, aborting"; exit 1; }
          curl -fsSL --retry 3 -o /tmp/s.zip "$URL"
          echo "$SHA  /tmp/s.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile,os
          z=zipfile.ZipFile('/tmp/s.zip');base=os.path.realpath('/tmp/x')
          for n in z.namelist():
              assert not n.startswith('/') and '..' not in n.split('/'), n
              assert os.path.realpath(os.path.join(base,n)).startswith(base), n
          z.extractall(base);print(len(z.namelist()),'ok')
          PY
          rsync -a /tmp/x/ ipl/quiz-full2/
          git config user.name github-actions
          git config user.email actions@github.com
          git add ipl/quiz-full2
          git diff --cached --name-only | grep -v '^ipl/quiz-full2/' && { echo "path outside target staged"; exit 1; } || true
          git diff --cached --name-status | grep -v -E '^(A|M)\s' && { echo "unexpected delete or rename"; exit 1; } || true
          git diff --cached --name-only
          git diff --cached --quiet || git commit -m "quiz-full2: replace 55 repeated questions (new facts, new voice clips)"
          git push
