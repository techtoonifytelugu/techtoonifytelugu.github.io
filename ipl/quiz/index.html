<!doctype html>
<html lang="te"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>IPL Quiz Show - TechToonify Telugu</title>
<link rel="stylesheet" href="style.css"/>
</head><body>
<div id="frame"><div id="stage">
  <div class="vignette"></div>
  <div class="hdr">
    <div class="brand gold">ఐపీఎల్ క్విజ్ షో</div>
    <div class="score"><div class="dots" id="dots"></div><div class="score-pill" id="score">మిని స్కోరు 0</div></div>
  </div>
  <div class="roundblock">
    <div class="pre"><span id="qnum">ప్రశ్న 1</span> <span class="en">· Question <span id="qnumen">1</span></span></div>
    <div class="big gold" id="roundname">ఐపీఎల్ క్విజ్</div>
  </div>
  <div class="qcard" id="qcard">
    <div class="qmeta"><div class="tag" id="tag">EASY</div><div class="qtimer" id="timer">⏱ --</div></div>
    <div class="qtext-te" id="qte"></div>
    <div class="qtext-en" id="qen"></div>
    <div class="tbar"><i id="tbar"></i></div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="chitti" id="chitti">
    <div class="avatar"><img id="face" src="img/smile.png" alt=""/></div>
    <div class="chitti-text">
      <div class="chitti-name gold">మిని</div>
      <div class="chitti-state" id="cstate"></div>
      <div class="chitti-tease" id="ctease"></div>
      <div class="chitti-ans" id="cans"></div>
    </div>
  </div>
  <div class="commentzone"><div class="rgb1"></div><div class="rgb2"></div><div class="rgb3"></div></div>
  <div id="start"><div><div class="gold big2">ఐపీఎల్ క్విజ్ షో</div><button id="go">▶ ప్రారంభించండి / Start</button></div></div>
  <div id="end"><div><div class="gold big2">ఈ రౌండ్ ముగిసింది!</div><div class="endsub">చూసినందుకు ధన్యవాదాలు. త్వరలో మళ్ళీ కలుద్దాం!</div></div></div>
</div></div>
<script src="game.js"></script>
</body></html>
